[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obb-pbd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
